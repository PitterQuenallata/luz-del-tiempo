[package]
name = "emisor"
version = "0.1.0"
description = "Emisor de La Luz del Tiempo: transmite el micrófono al servidor de radio."
edition = "2021"
rust-version = "1.77"

[lib]
name = "emisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
mp3lame-encoder = "0.2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
