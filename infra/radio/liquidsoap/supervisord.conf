; Supervisor de la radio (como AzuraCast con supervisord).
; Los grupos de cada emisora (<slug>:icecast-<slug> y <slug>:liquidsoap-<slug>) los escribe sincronizar.sh
; en /tmp/radio-conf. Aquí solo van el control y el sincronizador, que se reinicia si se cae.

[unix_http_server]
; Socket en un volumen compartido: la radio-api reinicia servicios por emisora a través de él
file=/control/supervisor.sock
; Solo lo ven los contenedores que montan el volumen de control (radio-api y este)
chmod=0777

[supervisord]
logfile=/var/log/radio/supervisord.log
logfile_maxbytes=5MB
logfile_backups=5
pidfile=/tmp/supervisord.pid
nodaemon=true
; Espera a que cada proceso termine con limpieza al apagar la radio
stopwaitsecs=15

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///control/supervisor.sock

[include]
files = /tmp/radio-conf/*.conf

[program:sincronizador]
command=/bin/sh /radio/sincronizar.sh
autostart=true
autorestart=true
startsecs=2
priority=1
stdout_logfile=/var/log/radio/sincronizador.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
